# dbt project that builds the Gold layer from Silver Parquet files.
# Run from the repository root:
#   dbt build --project-dir dbt --profiles-dir dbt
name: lakehouse
version: "1.0.0"
profile: lakehouse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  lakehouse:
    # Staging: thin views over Silver, one per source table. Only place that knows file layout.
    staging:
      +materialized: view
      +schema: staging
    # Marts: the Gold star schema, materialized as tables for fast BI queries.
    marts:
      +materialized: table
      +schema: gold

seeds:
  lakehouse:
    # Small reference tables that no source system provides, versioned as CSV in git.
    +schema: reference
