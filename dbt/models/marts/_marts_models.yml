version: 2

models:
  - name: fact_order_items
    description: >
      One row per product within an order. Left joins keep every sale; the not_null and
      relationships tests below prove every key resolved to a dimension row.
    columns:
      - name: order_item_key
        description: Surrogate key, md5 of order_id + product_id.
        data_tests: [not_null, unique]
      - name: order_id
        description: Degenerate dimension (the order number itself).
        data_tests: [not_null]
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: customer_key
        description: The customer version valid when the order was placed.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: channel_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_key
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: order_status
        description: Degenerate dimension. Revenue usually counts COMPLETED only.
        data_tests:
          - accepted_values:
              arguments:
                values: [PENDING, PROCESSING, COMPLETED, CANCELLED, REFUNDED]
      - name: quantity
        data_tests: [not_null]
      - name: net_amount
        data_tests: [not_null]

  - name: dim_product
    description: One row per product, latest known attributes (SCD Type 1).
    columns:
      - name: product_key
        description: Surrogate key, md5 of product_id.
        data_tests: [not_null, unique]
      - name: product_id
        description: Natural key from the source.
        data_tests: [not_null, unique]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: [Electronics, Fashion, Home, Beauty]
      - name: list_price
        data_tests: [not_null]

  - name: dim_customer
    description: >
      One row per version of a customer (SCD Type 2), rebuilt from order history.
      Validity is half-open [effective_start_date, effective_end_date); the current
      version has effective_end_date = null.
    columns:
      - name: customer_key
        description: Surrogate key, md5 of customer_id + effective_start_date.
        data_tests: [not_null, unique]
      - name: customer_id
        description: Natural key; repeats once per version.
        data_tests: [not_null]
      - name: membership_tier
        data_tests:
          - accepted_values:
              arguments:
                values: [Standard, Silver, Gold, Platinum]
      - name: effective_start_date
        data_tests: [not_null]
      - name: is_current
        data_tests: [not_null]

  - name: dim_channel
    description: One row per sales channel, from the channels seed.
    columns:
      - name: channel_key
        description: Surrogate key, md5 of channel_code.
        data_tests: [not_null, unique]
      - name: channel_code
        data_tests: [not_null, unique]

  - name: dim_date
    description: One row per calendar day, whole years around the order dates.
    columns:
      - name: date_key
        description: Integer YYYYMMDD.
        data_tests: [not_null, unique]
      - name: full_date
        data_tests: [not_null, unique]
      - name: day_of_week
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false
