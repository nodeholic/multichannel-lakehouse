version: 2

models:
  - name: dim_product
    description: One row per product, latest known attributes (SCD Type 1).
    columns:
      - name: product_key
        description: Surrogate key, md5 of product_id.
        data_tests: [not_null, unique]
      - name: product_id
        description: Natural key from the source.
        data_tests: [not_null, unique]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: [Electronics, Fashion, Home, Beauty]
      - name: list_price
        data_tests: [not_null]

  - name: dim_customer
    description: >
      One row per version of a customer (SCD Type 2), rebuilt from order history.
      Validity is half-open [effective_start_date, effective_end_date); the current
      version has effective_end_date = null.
    columns:
      - name: customer_key
        description: Surrogate key, md5 of customer_id + effective_start_date.
        data_tests: [not_null, unique]
      - name: customer_id
        description: Natural key; repeats once per version.
        data_tests: [not_null]
      - name: membership_tier
        data_tests:
          - accepted_values:
              arguments:
                values: [Standard, Silver, Gold, Platinum]
      - name: effective_start_date
        data_tests: [not_null]
      - name: is_current
        data_tests: [not_null]

  - name: dim_channel
    description: One row per sales channel, from the channels seed.
    columns:
      - name: channel_key
        description: Surrogate key, md5 of channel_code.
        data_tests: [not_null, unique]
      - name: channel_code
        data_tests: [not_null, unique]

  - name: dim_date
    description: One row per calendar day, whole years around the order dates.
    columns:
      - name: date_key
        description: Integer YYYYMMDD.
        data_tests: [not_null, unique]
      - name: full_date
        data_tests: [not_null, unique]
      - name: day_of_week
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false
