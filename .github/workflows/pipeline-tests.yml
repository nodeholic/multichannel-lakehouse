# Runs the pipeline tests and builds the dbt project on every PR and on pushes to dev/main.
name: pipeline-tests

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Python pipeline tests (Bronze -> Silver)
        run: pytest -v
      - name: Generate Bronze and build Silver
        run: |
          python src/data_generator.py --days 3 --orders-per-day 100
          python src/bronze_to_silver.py
      - name: dbt build (models + data tests)
        run: dbt build --project-dir dbt --profiles-dir dbt
