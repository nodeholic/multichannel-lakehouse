# Pipeline checks on every PR and on pushes to dev/main.
#   test        : fast, offline path (local storage, no Docker)
#   integration : the real path on the docker compose stack: S3 (RustFS) + Postgres
name: pipeline-tests

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Python pipeline tests (Bronze -> Silver)
        run: pytest -v
      - name: Generate Bronze and build Silver
        run: |
          python src/data_generator.py --days 3 --orders-per-day 100
          python src/bronze_to_silver.py
      - name: dbt build (models + data tests)
        run: dbt build --project-dir dbt --profiles-dir dbt

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      # DuckDB downloads httpfs and postgres on first use; cache them so a flaky download
      # does not fail the job. The key follows the pinned DuckDB version.
      - uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # The same docker-compose.yml as on a laptop, so CI also proves the compose file works.
      # The placeholder credentials of .env.example are fine for throwaway CI containers.
      - name: Start RustFS and Postgres
        run: |
          cp .env.example .env
          docker compose up -d --wait rustfs postgres
          docker compose run --rm create-buckets

      - name: All tests, including S3 and Postgres integration
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: pytest -v

      - name: Full pipeline on S3, Gold published to Postgres
        env:
          STORAGE: s3
        run: |
          python src/data_generator.py --start-date 2026-11-01 --days 7 --orders-per-day 200
          python src/bronze_to_silver.py
          python src/run_dbt.py build
          python src/publish_gold_to_postgres.py

      - name: Every Gold table is published and not empty
        run: python src/check_published_gold.py

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
